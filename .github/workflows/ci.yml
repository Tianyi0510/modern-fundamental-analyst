name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Playwright downloads its own Chromium; the runner's Chrome apt feed is unused.
      # Exclude it so a feed sync error cannot block Ubuntu dependency installation.
      - name: Disable unused Google Chrome apt source
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re

          for path in Path("/etc/apt/sources.list.d").iterdir():
              if path.suffix not in {".list", ".sources"}:
                  continue
              original = path.read_text()
              separator = "\n\n" if path.suffix == ".sources" else "\n"
              entries = re.split(r"\n\s*\n", original) if path.suffix == ".sources" else original.splitlines()
              kept = [entry for entry in entries if not re.search(r"https?://dl\.google\.com/linux/chrome(?:-stable)?/deb", entry)]
              if len(kept) != len(entries):
                  path.write_text(separator.join(kept) + "\n")
                  print(f"Disabled unused Chrome source in {path.name}")
          PYTHON

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify application
        run: npm run verify

      - name: Verify WebKit computed styles
        run: npm run test:computed-style -- --browser webkit --workers=1
        env:
          PLAYWRIGHT_USE_PRODUCTION_BUILD: "1"

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
