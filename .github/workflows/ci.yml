name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  static:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:static

  chromium:
    name: chromium-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: node_modules/.cache/playwright/reports/chromium-shard-${{ matrix.shard }}.json
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
      PLAYWRIGHT_SENTRY_TEST: "1"
      NEXT_PUBLIC_SENTRY_DSN: https://public@sentry.invalid/1
      NEXT_PUBLIC_VERCEL_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run build
      # Playwright downloads its own Chromium; the runner's Chrome apt feed is unused.
      # Exclude it so a feed sync error cannot block Ubuntu dependency installation.
      - name: Disable unused Google Chrome apt source
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re

          for path in Path("/etc/apt/sources.list.d").iterdir():
              if path.suffix not in {".list", ".sources"}:
                  continue
              original = path.read_text()
              separator = "\n\n" if path.suffix == ".sources" else "\n"
              entries = re.split(r"\n\s*\n", original) if path.suffix == ".sources" else original.splitlines()
              kept = [entry for entry in entries if not re.search(r"https?://dl\.google\.com/linux/chrome(?:-stable)?/deb", entry)]
              if len(kept) != len(entries):
                  path.write_text(separator.join(kept) + "\n")
                  print(f"Disabled unused Chrome source in {path.name}")
          PYTHON

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium
        run: npm run test:computed-style:production -- --fully-parallel --shard=${{ matrix.shard }}/2

      - name: Upload per-test timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-timings-chromium-${{ matrix.shard }}
          path: node_modules/.cache/playwright/reports/chromium-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser retry and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-chromium-${{ matrix.shard }}
          path: node_modules/.cache/playwright/chromium-shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  webkit-shards:
    name: webkit-shard-${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SENTRY_TEST: "1"
      NEXT_PUBLIC_SENTRY_DSN: https://public@sentry.invalid/1
      NEXT_PUBLIC_VERCEL_ENV: test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npm run test:webkit -- --shard=${{ matrix.shard }}
      - name: Upload per-test timing report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-timings-webkit-${{ matrix.shard }}
          path: node_modules/.cache/playwright/reports/webkit-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser retry and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-webkit-${{ matrix.shard }}
          path: node_modules/.cache/playwright/webkit-shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  performance:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SENTRY_DSN: https://public@sentry.invalid/1
      NEXT_PUBLIC_VERCEL_ENV: production
      # Playwright's downloaded Chrome has no Ubuntu AppArmor sandbox profile.
      # This disposable runner audits only the isolated, provider-disabled local site.
      LIGHTHOUSE_CHROME_FLAGS: --headless=new --no-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run build
      # The Ubuntu image already supplies browser libraries; use Playwright's pinned Chrome.
      - run: npx playwright install chromium
      - run: npm run test:performance
      - name: Upload performance samples and budget summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-evidence
          path: node_modules/.cache/performance/
          retention-days: 14
          if-no-files-found: warn

  verify:
    if: always()
    needs: [plan, static, chromium, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require verified evidence or successful full checks
        env:
          PLAN: ${{ needs.plan.result }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          STATIC: ${{ needs.static.result }}
          CHROMIUM: ${{ needs.chromium.result }}
          PERFORMANCE: ${{ needs.performance.result }}
        run: |
          test "$PLAN" = success
          if [ "$REUSE" != true ]; then
            test "$STATIC" = success
            test "$CHROMIUM" = success
            test "$PERFORMANCE" = success
          fi

  webkit:
    if: always()
    needs: [plan, webkit-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require verified evidence or both successful WebKit shards
        env:
          PLAN: ${{ needs.plan.result }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          WEBKIT: ${{ needs.webkit-shards.result }}
        run: |
          test "$PLAN" = success
          if [ "$REUSE" != true ]; then
            test "$WEBKIT" = success
          fi
