name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify types, lint, formatting and unit tests
        run: npm run verify:static

      - name: Build application
        run: npm run build

      # Playwright downloads its own Chromium; the runner's Chrome apt feed is unused.
      # Exclude it so a feed sync error cannot block Ubuntu dependency installation.
      - name: Disable unused Google Chrome apt source
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re

          for path in Path("/etc/apt/sources.list.d").iterdir():
              if path.suffix not in {".list", ".sources"}:
                  continue
              original = path.read_text()
              separator = "\n\n" if path.suffix == ".sources" else "\n"
              entries = re.split(r"\n\s*\n", original) if path.suffix == ".sources" else original.splitlines()
              kept = [entry for entry in entries if not re.search(r"https?://dl\.google\.com/linux/chrome(?:-stable)?/deb", entry)]
              if len(kept) != len(entries):
                  path.write_text(separator.join(kept) + "\n")
                  print(f"Disabled unused Chrome source in {path.name}")
          PYTHON

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium
        run: npm run test:computed-style:production

      - name: Upload browser retry and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-chromium
          path: node_modules/.cache/playwright/chromium/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: webkit-build
        run: npm run build

      - name: Install WebKit
        id: webkit-install
        run: npx playwright install webkit

      - name: Verify WebKit shard 1
        run: npm run test:webkit -- --shard=1

      - name: Verify WebKit shard 2
        if: ${{ !cancelled() && steps.webkit-build.outcome == 'success' && steps.webkit-install.outcome == 'success' }}
        run: npm run test:webkit -- --shard=2

      - name: Upload browser retry and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-webkit
          path: node_modules/.cache/playwright/webkit-shard-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
